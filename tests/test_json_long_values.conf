# Config file for test_json_long_values.sql
#
# JSON string values longer than 1024 characters used to be truncated by the
# JSON scanner. Row 1 carries a 5400-character string, row 2 a 2000-character
# array element: both must come out intact while 'email' is anonymized.
secret = 'lapin'
stats  = 'no'

tables = {
   `docs` = {
     `data` = json {
                     path 'email' = emailhash 'example.com' 10
                   }
   }
}
