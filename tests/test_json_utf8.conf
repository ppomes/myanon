# Config file for test_json_utf8.sql
#
# JSON values with non-ASCII characters. Hashes must be computed on the
# original UTF-8 bytes, and values that are not anonymized ('meta.city',
# 'note') must come out unchanged.
secret = 'lapin'
stats  = 'no'

tables = {
   `docs` = {
     `data` = json {
                     path 'name'      = texthash 8
                     path 'tags[]'    = texthash 6
                     path 'items[].k' = texthash 4
                   }
     `list` = json { path '[]' = texthash 5 }
   }
}
