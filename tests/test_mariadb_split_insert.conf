# Config file for test_mariadb_split_insert.sql
#
# mariadb-dump writes multi-line INSERT statements and splits big tables into
# several of them (here with a small --net-buffer-length). The Rust port
# copied every INSERT after the first one unchanged (issue #68).
secret = 'lapin'
stats  = 'no'

tables = {
   `customers` = {
     `email` = emailhash 'example.com' 10
     `name`  = texthash 8
   }
}
