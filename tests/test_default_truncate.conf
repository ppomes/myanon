secret = 'test-secret'
stats  = 'no'

# Tables the config does not match are truncated
default = 'truncate'

tables = {
   `users_field_data` = {
     `mail` = emailhash 'example.org' 20
   }
   # First matching rule wins: this one comes before regex `node.*`
   `node_access` = truncate
   regex `node.*` = keep
   `config` = keep
   regex `cache.*` = truncate
}
