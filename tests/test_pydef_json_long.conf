# Config file for test_pydef_json_long.sql
#
# A pydef inside a JSON path returning 70000 characters used to overflow a
# fixed-size stack buffer in the JSON replacement code, and results over
# 65535 characters were truncated. The full value must be written.
secret = 'lapin'
stats  = 'no'
pypath   = './tests'
pyscript = 'test_pydef_json_long'

tables = {
   `docs` = {
     `data` = json {
                     path 'secret' = pydef 'long_value'
                   }
   }
}
