# Config file for test_long_table_name.sql
# Both table names in the dump are 64 characters, the maximum MySQL allows,
# and differ only in their last character. Only the first one is configured:
# rows of the second must be left untouched. Found by fuzzing: the quoted
# name used to overflow (and then be truncated to) a 64-byte buffer.
secret = 'lapin'
stats  = 'no'

tables = {
   `ttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttta` = {
     `name`  = texthash 10
     `email` = emailhash 'example.com' 10
   }
}
