# Config file for test_pydef_json_paths.sql
#
# pydef inside JSON paths: a plain path, a path with arguments, wildcard
# paths and a root array, on values with non-ASCII characters.
secret = 'lapin'
stats  = 'no'
pypath   = './tests'
pyscript = 'test_pydef_json_paths'

tables = {
   `docs` = {
     `data` = json {
                     path 'name'      = pydef 'upper'
                     path 'meta.city' = pydef 'tag' 'CITY'
                     path 'tags[]'    = pydef 'upper'
                     path 'items[].k' = pydef 'tag' 'K'
                   }
     `list` = json { path '[]' = pydef 'upper' }
   }
}
