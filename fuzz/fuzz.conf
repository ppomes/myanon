# Config used for fuzzing the dump parser. It is deliberately wide: it names the
# tables of most seed dumps under tests/ and uses every anonymisation type that
# does not need Python, so that as many code paths as possible are reachable
# from a mutated dump. Warnings about fields not found in the dump are expected.
secret = 'lapin'
stats  = 'no'

tables = {
   `lottypes` = {
     `int1`      = inthash 2
     `int2`      = fixed '9'
     `datetime1` = fixed '1970-01-01 12:00:00'
     `year1`     = fixed '1925'
     `text1`     = texthash 5
     `text2`     = fixed null
     `blob1`     = fixed 'hello'
     `blob2`     = texthash 5
     `blob3`     = fixed '53b5d7742e226ac82b347f885730f86135dd42622ad158855af509c6ffaed6d6c2ba76a4d1749da23f618f86ba921220'
   }
   `table to truncate` = truncate
   `truncate_semicolon_case` = truncate
   `tata` = {
     `id`    = inthash 2
     `email` = emailhash 'example.com' 10
   }
   `toto` = {
     `a`    = inthash 5
     `b`    = fixed 'fixedvalue'
     `c`    = fixed ''
     `name` = texthash 10
   }
   `the_blobs` = {
     `blob1` = fixed unquoted '0x676f6f64627965'
   }
   `test_with_column_names` = {
     `a` = fixed '111'
     `b` = fixed '222'
   }
   `players` = {
     `id`   = key
     `name` = appendkey 'player'
   }
   `players1` = {
     `name` = appendindex 'player'
   }
   `realnextgen` = {
     `name` = prependindex 'nextgen'
   }
   regex `(prod|test)players` = {
     `lastname`  = texthash 20
     `firstname` = prependkey 'x'
   }
   `anontest` = {
      `metadata` = json {
        path 'name' = texthash 5
      }
   }
   `user` = {
     `email`     = emailhash 'example.com' 10
     `firstname` = texthash 10
     `lastname`  = texthash 10
   }
   `user_test` = {
     `name`  = texthash 20
     `email` = emailhash 'example.com' 10
   }
   `minimal_table` = {
     `minimal_col` = substring 5
   }
   `testing` = {
     `colB` = texthash 32
     `colC` = texthash 32
     `colD` = fixed '1234'
   }
   `points` = {
     `name`      = texthash 5
     `owner`     = json {
                          path 'email'     = emailhash 'example.com' 10
                          path 'last_name' = texthash 5
                          path 'first_name'= texthash 5
                        }
     `emails`    = emailhash 'example.com' 10 separated by ','
     `history`   = json { path 'email_changes[][]' =  emailhash 'example.com' 10 }
     `contacts`  = json { path '[]' = emailhash 'example.com' 10 }
   }
   `documents` = {
     `metadata` = json {
                        path 'a1b2c3d4-e5f6-7890-abcd-ef1234567890' = fixed 'MASKED-TOP-LEVEL'
                        path 'meta.author-email'                    = fixed 'MASKED-NESTED'
                        path 'tag-list[]'                           = fixed 'MASKED-ARRAY-ITEM'
                      }
   }
}
