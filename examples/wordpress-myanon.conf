#
# Myanon configuration for WordPress, with WooCommerce support.
#
# Requires myanon built with Python support (the Docker image has it, or
# ./configure --with-python) and the helper module wordpress_myanon.py.
# WordPress keeps a lot of personal data in key/value tables (wp_usermeta,
# wp_postmeta, wp_options...), which can only be handled per key in Python.
#
# Usage:
#   mysqldump wordpress | myanon -f wordpress-myanon.conf > anonymized.sql
#
# Before use:
#   - change the secret below;
#   - set pypath to the directory holding wordpress_myanon.py (relative paths
#     are relative to the directory myanon is run from);
#   - if your table prefix is not 'wp_', replace it everywhere below.
#
# What you get:
#   - users are renamed user<ID> / "User <ID>", e-mails become
#     <hash>@example.com, and every password is 'password';
#   - the same person gets the same fake name, e-mail and phone number in
#     every table, so users, orders and addresses still match;
#   - IDs, dates, statuses, roles and serialized data are left intact, so the
#     anonymized dump can be imported and used as a working site.
#
# Multisite: per-site tables (wp_2_posts, wp_2_comments...) are matched by the
# regex entries. If WooCommerce is not installed, myanon warns that its fields
# were not found in the dump: these warnings are harmless.
#
# Always check the result: plugins can store personal data in tables of their
# own, which you will need to add here.
#

secret = 'change-me'
stats  = 'no'

pypath   = '.'
pyscript = 'wordpress_myanon'

tables = {

    # ---------------------------------------------------------------- Users
    # Global to the whole network, even on multisite.

    `wp_users` = {
        `user_login`          = pydef 'user_login'      # user<ID>
        `user_nicename`       = pydef 'user_login'      # user<ID>
        `display_name`        = pydef 'display_name'    # User <ID>
        `user_email`          = pydef 'email'
        `user_pass`           = fixed '5f4dcc3b5aa765d61d8327deb882cf99'  # MD5 of 'password', upgraded by WordPress at first login
        `user_url`            = fixed ''
        `user_activation_key` = fixed ''
    }

    # first_name, last_name, nickname, description, billing_* and shipping_*,
    # session tokens (IP addresses and user agents)...
    `wp_usermeta` = {
        `meta_value` = pydef 'meta'
    }

    # Multisite only
    `wp_signups` = {
        `user_login`     = pydef 'name'
        `user_email`     = pydef 'email'
        `activation_key` = fixed ''
        `meta`           = pydef 'scrub'          # serialized signup data
    }

    # ------------------------------------------------- Per-site core tables

    regex `wp_([0-9]+_)?comments` = {
        `comment_author`       = pydef 'comment_author'    # "User <ID>" for registered users
        `comment_author_email` = pydef 'email'
        `comment_author_url`   = fixed ''
        `comment_author_IP`    = pydef 'ip'
        `comment_agent`        = fixed ''
        `comment_content`      = pydef 'comment_content'   # order notes are kept, minus e-mails
    }

    regex `wp_([0-9]+_)?commentmeta` = {
        `meta_value` = pydef 'meta'
    }

    # Orders stored as posts keep the customer note in post_excerpt
    regex `wp_([0-9]+_)?posts` = {
        `post_excerpt` = pydef 'post_excerpt'
    }

    # Order billing and shipping data when WooCommerce stores orders as posts
    regex `wp_([0-9]+_)?postmeta` = {
        `meta_value` = pydef 'meta'
    }

    # Admin and SMTP e-mails, SMTP password, e-mails inside serialized settings
    regex `wp_([0-9]+_)?options` = {
        `option_value` = pydef 'option'
    }

    # ---------------------------------------------------------- WooCommerce

    regex `wp_([0-9]+_)?wc_orders` = {
        `billing_email`  = pydef 'email'
        `ip_address`     = pydef 'ip'
        `user_agent`     = fixed ''
        `customer_note`  = fixed ''
        `transaction_id` = fixed ''
    }

    regex `wp_([0-9]+_)?wc_order_addresses` = {
        `first_name` = pydef 'name'
        `last_name`  = pydef 'name'
        `company`    = pydef 'company'
        `address_1`  = pydef 'street'
        `address_2`  = fixed ''
        `city`       = pydef 'city'
        `postcode`   = pydef 'postcode'
        `email`      = pydef 'email'
        `phone`      = pydef 'digits'
    }

    regex `wp_([0-9]+_)?wc_orders_meta` = {
        `meta_value` = pydef 'meta'
    }

    regex `wp_([0-9]+_)?wc_customer_lookup` = {
        `username`   = pydef 'lookup_username'
        `first_name` = pydef 'name'
        `last_name`  = pydef 'name'
        `email`      = pydef 'email'
        `postcode`   = pydef 'postcode'
        `city`       = pydef 'city'
    }

    regex `wp_([0-9]+_)?woocommerce_downloadable_product_permissions` = {
        `user_email` = pydef 'email'
    }

    regex `wp_([0-9]+_)?wc_download_log` = {
        `user_ip_address` = pydef 'ip'
    }

    # Sessions, saved payment methods, API keys, webhook secrets and logs:
    # nothing a development copy needs.
    regex `wp_([0-9]+_)?woocommerce_sessions`          = truncate
    regex `wp_([0-9]+_)?woocommerce_payment_tokens`    = truncate
    regex `wp_([0-9]+_)?woocommerce_payment_tokenmeta` = truncate
    regex `wp_([0-9]+_)?woocommerce_api_keys`          = truncate
    regex `wp_([0-9]+_)?wc_webhooks`                   = truncate
    regex `wp_([0-9]+_)?woocommerce_log`               = truncate
    regex `wp_([0-9]+_)?actionscheduler_logs`          = truncate
}
