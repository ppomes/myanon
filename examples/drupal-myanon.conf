#
# Myanon configuration for Drupal 10 and 11 (MySQL or MariaDB).
#
# Requires myanon built with Python support (the Docker image has it, or
# ./configure --with-python) and the helper module drupal_myanon.py.
#
# Usage:
#   mysqldump drupal | myanon -f drupal-myanon.conf > anonymized.sql
#
# Before use:
#   - change the secret below;
#   - set pypath to the directory holding drupal_myanon.py (relative paths
#     are relative to the directory myanon is run from);
#   - if you use a table prefix, add it to every table name below.
#
# What you get:
#   - users are renamed user<uid>, e-mails become <hash>@example.com, and
#     every password is 'password';
#   - anonymous commenters' names, e-mails, websites and IP addresses are
#     replaced, and comment texts become placeholder text;
#   - caches, logs, sessions and flood control entries are deleted (Drupal
#     rebuilds its caches on the next request);
#   - content (nodes) is kept as is.
#
# Fields added to users (first name, last name, phone...) each have a table
# of their own, user__field_<name>: add one entry per field, as done below
# for field_first_name and field_last_name. The same goes for contrib modules
# storing personal data (Webform submissions, contact storage, Commerce...).
#

secret = 'change-me'
stats  = 'no'

pypath   = '.'
pyscript = 'drupal_myanon'

tables = {

    # ---------------------------------------------------------------- Users

    `users_field_data` = {
        `name` = pydef 'user_name'      # user<uid>, the anonymous user keeps ''
        `pass` = fixed '$2y$12$Qig8vn83j/DEvtYzBoIJWO6FVpjk/dUDuSbPeNavjmRxuTy1YYiv2'  # 'password'
        `mail` = pydef 'email'
        `init` = pydef 'email'
    }

    # Examples of fields added to the user entity: adapt to your site
    `user__field_first_name` = { `field_first_name_value` = pydef 'name' }
    `user__field_last_name`  = { `field_last_name_value`  = pydef 'name' }

    # ------------------------------------------------------------- Comments

    `comment_field_data` = {
        `name`     = pydef 'name'       # anonymous commenters only (NULL otherwise)
        `mail`     = pydef 'email'
        `homepage` = fixed ''
        `hostname` = pydef 'ip'
        `subject`  = pydef 'lorem'
    }

    `comment__comment_body` = {
        `comment_body_value` = pydef 'lorem'
    }

    `comment_entity_statistics` = {
        `last_comment_name` = pydef 'name'
    }

    # ------------------------------------------------------- Configuration

    # Site e-mail, update notification e-mails... (serialized PHP)
    `config` = {
        `data` = pydef 'config_data'
    }

    # ------------------------------------- Caches, logs, sessions and flood

    regex `cache_[a-z_]+` = truncate
    `watchdog`            = truncate
    `sessions`            = truncate
    `flood`               = truncate
    `key_value_expire`    = truncate
    `batch`               = truncate   # may hold submitted form values
}
