#
# Myanon configuration for phpBB 3.3 (MySQL or MariaDB).
#
# Requires myanon built with Python support (the Docker image has it, or
# ./configure --with-python) and the helper module phpbb_myanon.py.
#
# Usage:
#   mysqldump phpbb | myanon -f phpbb-myanon.conf > anonymized.sql
#
# Before use:
#   - change the secret below;
#   - set pypath to the directory holding phpbb_myanon.py (relative paths
#     are relative to the directory myanon is run from);
#   - if your table prefix is not 'phpbb_', replace it everywhere below.
#
# What you get:
#   - registered users become user<user_id> everywhere their name appears,
#     e-mails become <hash>@example.com, and every password is 'password';
#     bots and the anonymous user are left as they are;
#   - guest names, IP addresses, signatures, birthdays and profile fields are
#     replaced or cleared;
#   - post, private message, draft and report texts become placeholder text;
#   - sessions, logs, login attempts and the search index are deleted. Rebuild
#     the search index from the ACP (General > Search index) after import.
#
# Custom profile fields created on your board are columns of
# phpbb_profile_fields_data named pf_<name>: add them below.
#

secret = 'change-me'
stats  = 'no'

pypath   = '.'
pyscript = 'phpbb_myanon'

tables = {

    # ---------------------------------------------------------------- Users

    `phpbb_users` = {
        `username`       = pydef 'username'       # user<user_id>, bots kept
        `username_clean` = pydef 'username'
        `user_password`  = pydef 'password'       # 'password'
        `user_email`     = pydef 'email'
        `user_ip`        = pydef 'ip'
        `user_birthday`  = fixed ''
        `user_sig`       = fixed ''
        `user_jabber`    = fixed ''
        `user_lastpage`  = fixed ''
        `user_actkey`    = fixed ''
        `reset_token`    = fixed ''
        `user_newpasswd` = fixed ''
    }

    `phpbb_profile_fields_data` = {
        `pf_phpbb_interests`  = fixed ''
        `pf_phpbb_occupation` = fixed ''
        `pf_phpbb_location`   = fixed ''
        `pf_phpbb_skype`      = fixed ''
        `pf_phpbb_facebook`   = fixed ''
        `pf_phpbb_icq`        = fixed ''
        `pf_phpbb_twitter`    = fixed ''
        `pf_phpbb_website`    = fixed ''
        `pf_phpbb_youtube`    = fixed ''
        `pf_phpbb_yahoo`      = fixed ''
    }

    # Board e-mails and the newest member's name
    `phpbb_config` = {
        `config_value` = pydef 'config_value'
    }

    `phpbb_banlist` = {
        `ban_email`       = pydef 'email'
        `ban_ip`          = pydef 'ip'
        `ban_reason`      = fixed ''
        `ban_give_reason` = fixed ''
    }

    # --------------------------------------------------------------- Posts

    `phpbb_posts` = {
        `poster_ip`          = pydef 'ip'
        `post_username`      = pydef 'post_username'   # guest posts only
        `post_subject`       = pydef 'subject'
        `post_text`          = pydef 'lorem'
        `post_checksum`      = fixed '35899082e51edf667f14477ac000cbba'   # MD5 of the placeholder text
        `post_edit_reason`   = fixed ''
        `post_delete_reason` = fixed ''
    }

    `phpbb_topics` = {
        `topic_title`             = pydef 'subject'
        `topic_first_poster_name` = pydef 'poster_name' 'topic_poster'
        `topic_last_poster_name`  = pydef 'poster_name' 'topic_last_poster_id'
        `topic_last_post_subject` = pydef 'subject'
        `poll_title`              = pydef 'subject'
        `topic_delete_reason`     = fixed ''
    }

    `phpbb_forums` = {
        `forum_last_poster_name`  = pydef 'poster_name' 'forum_last_poster_id'
        `forum_last_post_subject` = pydef 'subject'
    }

    `phpbb_poll_votes` = {
        `vote_user_ip` = pydef 'ip'
    }

    `phpbb_attachments` = {
        `real_filename`  = pydef 'filename'
        `attach_comment` = fixed ''
    }

    `phpbb_drafts` = {
        `draft_subject` = pydef 'subject'
        `draft_message` = pydef 'lorem'
    }

    `phpbb_reports` = {
        `report_text`        = pydef 'lorem'
        `reported_post_text` = pydef 'lorem'
    }

    # ---------------------------------------------------- Private messages

    `phpbb_privmsgs` = {
        `author_ip`           = pydef 'ip'
        `message_subject`     = pydef 'subject'
        `message_text`        = pydef 'lorem'
        `message_edit_reason` = fixed ''
    }

    # ----------------------------- Sessions, logs, search index and tokens

    `phpbb_sessions`         = truncate
    `phpbb_sessions_keys`    = truncate
    `phpbb_login_attempts`   = truncate
    `phpbb_log`              = truncate
    `phpbb_notifications`    = truncate
    `phpbb_confirm`          = truncate
    `phpbb_oauth_tokens`     = truncate
    `phpbb_oauth_states`     = truncate
    `phpbb_search_wordlist`  = truncate
    `phpbb_search_wordmatch` = truncate
    `phpbb_search_results`   = truncate
}
