#
# Myanon configuration for Nextcloud (MySQL or MariaDB).
#
# Requires myanon built with Python support (the Docker image has it, or
# ./configure --with-python) and the helper module nextcloud_myanon.py.
#
# Usage:
#   mysqldump nextcloud | myanon -f nextcloud-myanon.conf > anonymized.sql
#
# Before use:
#   - change the secret below;
#   - set pypath to the directory holding nextcloud_myanon.py (relative paths
#     are relative to the directory myanon is run from);
#   - if your table prefix is not 'oc_', replace it everywhere below.
#
# What you get:
#   - login names become u<8 letters> everywhere ('admin' is kept, see
#     KEEP_UIDS in nextcloud_myanon.py), and every password is 'password';
#   - names, e-mails, phone numbers and the other profile fields are replaced,
#     consistently across tables;
#   - user file and folder names are renamed, keeping their extension;
#   - contacts, calendar events, activity, notifications, sessions and tokens
#     are deleted. Run 'occ dav:sync-system-addressbook' after import to
#     rebuild the system address book.
#
# The data directory is not part of the dump: files will be listed in the
# anonymized instance but their content will be missing.
#
# Apps not covered here (Mail, Talk, Deck, Forms...) have tables of their own
# that may hold personal data: add them before use.
#

secret = 'change-me'
stats  = 'no'

pypath   = '.'
pyscript = 'nextcloud_myanon'

tables = {

    # --------------------------------------------------------------- Users

    `oc_users` = {
        `uid`         = pydef 'uid'
        `uid_lower`   = pydef 'uid'
        `displayname` = pydef 'name'
        `password`    = fixed '3|$argon2id$v=19$m=65536,t=4,p=1$WjNKZWFmekpTZVVsVkJiZA$sgUYdBsVLUmyxhKGBOG+M25xgRezSe1c2NxQoAnhus8'  # 'password'
    }

    `oc_accounts` = {
        `uid`  = pydef 'uid'
        `data` = pydef 'account_data'     # JSON of profile properties
    }

    `oc_accounts_data` = {
        `uid`   = pydef 'uid'
        `value` = pydef 'account_value'
    }

    `oc_preferences` = {
        `userid`      = pydef 'uid'
        `configvalue` = pydef 'preference'
        `indexed`     = pydef 'preference'    # copy of some values (Nextcloud 31+)
    }

    `oc_group_user`  = { `uid` = pydef 'uid' }
    `oc_group_admin` = { `uid` = pydef 'uid' }
    `oc_twofactor_providers` = { `uid` = pydef 'uid' }
    `oc_notifications_settings` = { `user_id` = pydef 'uid' }

    `oc_user_status` = {
        `user_id`        = pydef 'uid'
        `custom_message` = fixed ''
    }

    `oc_appconfig` = {
        `configvalue` = pydef 'appconfig'
    }

    # ---------------------------------------------------------------- Files

    `oc_storages` = {
        `id` = pydef 'storage_id'         # home::<uid>
    }

    `oc_filecache` = {
        `path`      = pydef 'filecache_path'
        `path_hash` = pydef 'filecache_path_hash'   # MD5 of the new path
        `name`      = pydef 'filecache_name'
    }

    `oc_files_versions` = {
        `metadata` = pydef 'json_args'    # {"author":"<uid>"}
    }

    # Custom WebDAV properties and favorites, keyed by file paths
    `oc_properties` = truncate

    `oc_share` = {
        `share_with`    = pydef 'share_with'      # user, e-mail or federated
        `uid_owner`     = pydef 'uid'
        `uid_initiator` = pydef 'uid'
        `file_target`   = pydef 'share_target'
        `password`      = pydef 'share_password'  # 'password'
        `note`          = fixed ''
        `label`         = fixed ''
    }

    # ----------------------------------------------- Comments, teams, jobs

    `oc_comments` = {
        `actor_id` = pydef 'comment_actor'
        `message`  = pydef 'lorem'
    }

    `oc_comments_read_markers` = { `user_id` = pydef 'uid' }

    `oc_circles_circle` = {
        `name`         = pydef 'circle_name'          # user:<uid>:<id>
        `display_name` = pydef 'circle_display_name'
        `description`  = fixed ''
    }

    `oc_circles_member` = {
        `user_id`     = pydef 'circle_member_uid'
        `cached_name` = pydef 'circle_member_name'
        `note`        = fixed ''
    }

    `oc_jobs` = {
        `argument` = pydef 'json_args'    # JSON arguments with uids and e-mails
    }

    # ------------------------------------------------ Contacts and calendars

    `oc_addressbooks` = {
        `principaluri` = pydef 'principal'
        `description`  = fixed ''
    }
    `oc_calendars` = {
        `principaluri` = pydef 'principal'
        `displayname`  = fixed 'Calendar'
        `description`  = fixed ''
    }
    `oc_dav_shares` = { `principaluri` = pydef 'principal' }

    `oc_calendarsubscriptions` = truncate   # private feed URLs

    `oc_cards`                 = truncate
    `oc_cards_properties`      = truncate
    `oc_addressbookchanges`    = truncate
    `oc_calendarobjects`       = truncate
    `oc_calendarobjects_props` = truncate
    `oc_calendarchanges`       = truncate
    `oc_calendar_invitations`  = truncate
    `oc_calendar_reminders`    = truncate
    `oc_schedulingobjects`     = truncate
    `oc_recent_contact`        = truncate

    # ------------------------------- Activity, caches, sessions and tokens

    `oc_mounts`                 = truncate   # mount cache, rebuilt on access
    `oc_activity`               = truncate
    `oc_activity_mq`            = truncate
    `oc_notifications`          = truncate
    `oc_notifications_pushhash` = truncate
    `oc_notifications_webpush`  = truncate
    `oc_authtoken`              = truncate
    `oc_bruteforce_attempts`    = truncate
    `oc_ratelimit_entries`      = truncate
    `oc_login_flow_v2`          = truncate
    `oc_direct_edit`            = truncate
    `oc_directlink`             = truncate
    `oc_oauth2_access_tokens`   = truncate
    `oc_oauth2_clients`         = truncate
    `oc_webauthn`               = truncate
    `oc_text_documents`         = truncate
    `oc_text_sessions`          = truncate
    `oc_text_steps`             = truncate
}
